name: Deploy DAIMO documentation

on:
  # Manual-only: enable GitHub Pages (Settings > Pages > Source: GitHub Actions)
  # and then run this workflow from the Actions tab to publish daimo/docs.
  # Automatic push triggers were removed so routine commits do not fail CI
  # while Pages deployment is not configured.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daimo-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: daimo/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
